# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-fabric-triage-demo
services:
    bi-request-triage:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
    bi-triage-controller:
        project: ./src
        host: azure.ai.agent
        language: python
        uses:
            - bi-request-triage
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: app.py
            runtime: python_3_13
        container:
            resources:
                cpu: "1"
                memory: 2Gi
        kind: hosted
        name: bi-triage-controller
        environmentVariables:
            # INFO so the container explains its own decisions in the log --
            # which identity it presented, what it ignored and why. A hosted
            # agent you cannot interrogate is a hosted agent you cannot trust.
            - name: TRIAGE_LOG_LEVEL
              value: INFO
            # The controller reasons through the Foundry prompt agents and acts
            # through real tools. Mock stays available for offline rehearsal by
            # overriding these, but the deployed default is the real thing.
            - name: TRIAGE_PROVIDER_MODE
              value: foundry
            - name: TRIAGE_TOOL_MODE
              value: live
            - name: FOUNDRY_PROJECT_ENDPOINT
              value: ${AZURE_AI_PROJECT_ENDPOINT}
            - name: FOUNDRY_TRIAGE_AGENT_NAME
              value: bi-triage
            - name: FOUNDRY_DQ_AGENT_NAME
              value: bi-data-quality
            - name: FOUNDRY_AGENT_MODEL
              value: gpt-5.6-luna
            - name: FOUNDRY_HANDOFF_MODE
              value: responses
            # Mailbox ingestion is the one thing the agent identity cannot do.
            # Verified from inside this container: with the same token, Graph's
            # directory endpoint returns 200 while the Exchange-backed mail
            # endpoint returns 401. Graph accepts an Entra agent identity;
            # Exchange does not yet accept one for app-only mailbox access.
            #
            # So ingestion falls back to a conventional app registration,
            # scoped by an Exchange ApplicationAccessPolicy to a single
            # mailbox. It is the only credential in this deployment, it expires,
            # and it is precisely what the agent identity removes everywhere
            # else. Injected from the azd environment, never committed.
            - name: GRAPH_TENANT_ID
              value: ${AZURE_TENANT_ID}
            - name: GRAPH_CLIENT_ID
              value: ${GRAPH_CLIENT_ID}
            - name: GRAPH_CLIENT_SECRET
              value: ${GRAPH_CLIENT_SECRET}
            - name: GRAPH_MAILBOX
              value: ${GRAPH_MAILBOX}
            # A mailbox the agent must NOT be able to read. Startup refuses to
            # ingest if this read succeeds, because app-only Mail.Read is
            # tenant-wide until Exchange scopes it.
            - name: GRAPH_CANARY_MAILBOX
              value: ${GRAPH_CANARY_MAILBOX}
            # Senders the agent will act on. Power BI's own no-reply addresses,
            # plus the presenter's address as a documented demo-injection route:
            # a live demo needs a way to make an alert arrive on cue, and
            # emailing the alerts mailbox is the honest way to do it.
            #
            # Note this is the same address as the canary above, and that is not
            # a contradiction: the presenter may *send* an alert to the agent,
            # while the agent still cannot *read* the presenter's mailbox. Those
            # are different permissions and the demo shows both.
            #
            # This is still an allowlist. Adding a known address is a different
            # thing from removing the check, and the filter continues to reject
            # everything else -- 10 messages on the last sweep.
            - name: GRAPH_SENDER_ALLOWLIST
              value: ${GRAPH_SENDER_ALLOWLIST}
            - name: INCIDENT_TABLE_ENDPOINT
              value: ${INCIDENT_TABLE_ENDPOINT}
            - name: INCIDENT_TABLE_NAME
              value: incidents
            # Approval requests wait here and human decisions land here. It
            # has to be shared, durable state: the agent writes the request
            # in one invocation and a person answers from somewhere else
            # entirely -- a Teams card, or `triage-demo approve`.
            - name: APPROVAL_TABLE_NAME
              value: approvals
            # The URL behind the card's Approve/Decline buttons. A card
            # posted through an incoming webhook has no bot behind it, so
            # Action.Submit does nothing; the buttons have to be links to
            # something that writes the decision. Left unset, the card shows
            # the request id and the CLI is the channel.
            - name: APPROVAL_CALLBACK_URL
              value: ${APPROVAL_CALLBACK_URL}
            # The silent-failure detector. Off switch lives here rather than
            # in routine state, because routine state is not reliably
            # managed from this file -- see docs/operations.md.
            - name: SILENT_SWEEP_ENABLED
              value: "true"
            # Empty by default. A detector told nothing watches nothing,
            # which is correct: "fresh" is a business question per model, and
            # guessing it produces the false positives that get it muted.
            - name: SILENT_HEALTH_PROBES
              value: ${SILENT_HEALTH_PROBES}
            # Live Power BI. No client id or secret: Power BI accepts this
            # agent identity as a workspace principal, so the controller
            # triggers refreshes and reads refresh history as itself.
            # (Exchange does not accept it -- see the GRAPH_* note above. The
            # two services differ, and the demo says so rather than glossing it.)
            - name: POWERBI_TENANT_ID
              value: ${AZURE_TENANT_ID}
            - name: POWERBI_WORKSPACE_ID
              value: 1002e59c-cd3c-4364-97b7-0a890221eec4
            - name: POWERBI_DATASET_ID
              value: 4c6e3d18-5119-4622-9c11-83445ee78eb5
            # Teams delivery. Empty means the notifier stays mocked, which is
            # the correct fallback rather than a failure: a demo should not die
            # because a webhook is missing. Populate it with
            #   python demo\scripts\setup_teams_webhook.py --login   (once)
            #   python demo\scripts\setup_teams_webhook.py --create
            # then redeploy. The URL is a bearer credential -- anyone holding it
            # can post to that channel -- so it lives in the azd environment,
            # which is gitignored, and never in this file.
            - name: TEAMS_WEBHOOK_URL
              value: ${TEAMS_WEBHOOK_URL}
            - name: TEAMS_MODE
              value: webhook
        protocols:
            - protocol: responses
              version: 2.0.0
    # The trigger that would remove the laptop from the loop. It does not
    # work today, so it ships disabled.
    #
    # Verified 2026-09-02, six days after registering it: `azd ai routine
    # show` reports it enabled with this cron, `azd ai routine list` returns
    # {"value": null}, `azd ai routine run list` reports no runs, and a manual
    # dispatch returns three ids while the container does nothing. Application
    # Insights showed activity in two of twenty-four hours -- both of them
    # hours when a person invoked the agent by hand.
    #
    # It is declared rather than deleted because the shape is right and costs
    # nothing while disabled: when the preview defect is fixed, this becomes a
    # one-line change instead of a rediscovery. It is disabled rather than
    # left enabled because an accelerator whose whole subject is failures that
    # never announce themselves must not ship a scheduler that silently does
    # nothing -- an adopter would deploy, read `enabled: true`, and never learn
    # that their triage agent has not run since the day they installed it.
    #
    # Test it in your own tenant before turning it on; this may be regional or
    # may already be fixed. Until then drive the agent from a scheduler you
    # already trust -- see docs/operations.md. Nothing needs rewriting either
    # way, because the scheduled path and the interactive path are the same
    # code.
    #
    # Empty input is deliberate and load-bearing -- the controller treats a
    # short payload as "no specific alert, go and look", which is exactly what a
    # scheduled run means. Five minutes is a demo cadence; production would be
    # driven by a Graph change notification instead of a poll.
    bi-triage-schedule:
        host: azure.ai.routine
        uses:
            - bi-triage-controller
        description: Drain the BI alerts mailbox and triage anything new
        enabled: false
        triggers:
            default:
                type: schedule
                cron_expression: "*/5 * * * *"
                time_zone: America/Chicago
        action:
            type: invoke_agent_responses_api
            agent_name: bi-triage-controller
            input: "scheduled sweep"
infra:
    provider: microsoft.foundry
